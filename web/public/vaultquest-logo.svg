    <text x="400" y="658" font-family="Syne, Segoe UI, sans-serif" font-size="78" font-weight="800" letter-spacing="-0.03em" fill="#e8eef4">VaultQuest</text>
    <rect x="242" y="675" width="316" height="4" rx="2" fill="#2dd4bf" opacity="0.95"/>
    <text x="400" y="710" font-family="Sora, Segoe UI, sans-serif" font-size="18" font-weight="400" letter-spacing="0.08em" fill="#9aabbc">Transparent gaming rewards</text>
