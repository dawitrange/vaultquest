<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">VaultQuest — vault wheel mark</title>
  <desc id="desc">Vault wheel hero with VaultQuest wordmark — thick teal outer ring, brass 3-spoke handle extended at 135 degrees, cold vault #0b1014. Wordmark VaultQuest below wheel, legible in 500px export and centered in circular avatar crop.</desc>
