<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
  <title id="title">VaultQuest banner — 2560x1440 master (safe 1546x423)</title>
  <desc id="desc">Cold vault chamber with VaultQuest lockup: left vault wheel 300px + Vault over Quest wordmark with teal underline, tagline Transparent gaming rewards. Safe 1546x423 centered at 1280,720. Delete the safe-guide rect before JPG export.</desc>
  <rect width="2560" height="1440" fill="#0b1014"/>
  <defs>
    <radialGradient id="tealRim" cx="72%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="42%" stop-color="#2dd4bf" stop-opacity="0.08"/>
      <stop offset="78%" stop-color="#0b1014" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="steelWash" cx="22%" cy="72%" r="70%">
      <stop offset="0%" stop-color="#8fa3b8" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#1c262f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b1014" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steelPanels" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182028" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0b1014" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#steelWash)"/>
  <rect width="2560" height="1440" fill="url(#tealRim)"/>
  <!-- side steel panels -->
  <rect x="0" y="0" width="520" height="1440" fill="#11181f" opacity="0.92"/>
  <rect x="0" y="0" width="520" height="1440" fill="url(#steelPanels)" opacity="0.85"/>
  <rect x="172" y="0" width="2" height="1440" fill="#2a3642" opacity="0.95"/>
  <rect x="344" y="0" width="2" height="1440" fill="#2a3642" opacity="0.55"/>
  <rect x="2040" y="0" width="520" height="1440" fill="#11181f" opacity="0.88"/>
  <rect x="2040" y="0" width="520" height="1440" fill="url(#steelPanels)" opacity="0.75"/>
  <rect x="2216" y="0" width="2" height="1440" fill="#2a3642" opacity="0.95"/>
  <rect x="2388" y="0" width="2" height="1440" fill="#2a3642" opacity="0.55"/>
  <!-- center depth -->
  <rect x="520" y="0" width="1520" height="1440" fill="#0e1720" opacity="0.12"/>
  <rect x="680" y="0" width="1200" height="1440" fill="none" stroke="#2dd4bf" stroke-opacity="0.065" stroke-width="2"/>
  <!-- floor + vault light -->
  <rect x="0" y="1188" width="2560" height="2" fill="#2a3642" opacity="0.9"/>
  <rect x="0" y="1192" width="2560" height="180" fill="#0a0e12" opacity="0.9"/>
  <ellipse cx="1280" cy="240" rx="820" ry="220" fill="#e8eef4" opacity="0.04"/>
  <ellipse cx="1280" cy="280" rx="560" ry="90" fill="#2dd4bf" opacity="0.07"/>
  <rect x="0" y="980" width="2560" height="460" fill="#0b1014" opacity="0.42"/>
  <!-- SAFE AREA LOCKUP — all critical elements inside 1546x423 at 507,508 -->
  <!-- left vault wheel — 300px diameter, center at 700,720 -->
  <g id="lockup" transform="translate(0,0)">
    <g id="vault-wheel-banner" transform="translate(700,720)">
      <circle r="132" fill="#0b1014" stroke="#2dd4bf" stroke-width="10" opacity="0.98"/>
      <circle r="140" fill="none" stroke="#2dd4bf" stroke-width="0.9" opacity="0.16"/>
      <circle r="119" fill="none" stroke="#2a3642" stroke-width="1.2" opacity="0.5"/>
      <g id="ticks-banner" opacity="0.92">
        <g transform="rotate(0)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(15)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
        <g transform="rotate(30)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(45)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
        <g transform="rotate(60)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(75)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
        <g transform="rotate(90)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(105)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
        <g transform="rotate(120)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(135)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
        <g transform="rotate(150)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(165)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
        <g transform="rotate(180)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(195)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
        <g transform="rotate(210)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(225)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
        <g transform="rotate(240)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(255)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
        <g transform="rotate(270)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(285)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
        <g transform="rotate(300)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(315)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
        <g transform="rotate(330)"><rect x="-0.9" y="-147" width="1.8" height="10" rx="0.9" fill="#e8eef4" opacity="0.9"/></g>
        <g transform="rotate(345)"><rect x="-0.7" y="-147" width="1.4" height="6" rx="0.7" fill="#e8eef4" opacity="0.34"/></g>
      </g>
      <!-- 3-spoke handle — one spoke extends beyond ring at 135deg like reference -->
      <g id="handle-banner">
        <g transform="rotate(135)">
          <rect x="-6.5" y="-32" width="13" height="140" rx="6.5" fill="#c4a574"/>
          <rect x="-6.5" y="98" width="13" height="14" rx="4" fill="#c4a574" opacity="0.95"/>
        </g>
        <g transform="rotate(255)">
          <rect x="-6.5" y="-32" width="13" height="100" rx="6.5" fill="#c4a574" opacity="0.98"/>
        </g>
        <g transform="rotate(15)">
          <rect x="-6.5" y="-32" width="13" height="100" rx="6.5" fill="#c4a574" opacity="0.98"/>
        </g>
      </g>
      <circle r="34" fill="#0b1014" stroke="#c4a574" stroke-width="2.2"/>
      <circle r="28" fill="none" stroke="#c4a574" stroke-width="0.8" opacity="0.25"/>
      <circle r="7" fill="#c4a574"/>
      <circle r="2.8" fill="#0b1014" opacity="0.95"/>
    </g>
    <!-- wordmark to the right of wheel — VaultQuest stacked lockup -->
    <text x="895" y="698" font-family="Syne, Segoe UI, sans-serif" font-size="132" font-weight="800" letter-spacing="-0.04em" fill="#e8eef4">Vault</text>
    <text x="895" y="810" font-family="Syne, Segoe UI, sans-serif" font-size="76" font-weight="700" letter-spacing="0.24em" fill="#e8eef4">Quest</text>
    <!-- 2px teal underline between Vault and Quest — reads VaultQuest stacked -->
    <rect x="900" y="720" width="560" height="2.5" rx="1.25" fill="#2dd4bf" opacity="0.95"/>
    <!-- tagline -->
    <text x="900" y="866" font-family="Sora, Segoe UI, sans-serif" font-size="28" font-weight="400" letter-spacing="0.04em" fill="#9aabbc">Transparent gaming rewards</text>
    <!-- mono strip -->
    <text x="900" y="902" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="500" letter-spacing="0.14em" fill="#6b7d8f">vaultquest.io</text>
  </g>
  <!-- safe area guide — delete this rect before exporting JPG for Facebook/YouTube -->
  <rect id="safe-guide" x="507" y="508" width="1546" height="423" rx="18" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="18 14" opacity="0.11"/>
</svg>
